# =============================================================================
# master_service — uvicorn 웹 스택 + openproject + jenkins + gitolite 조합
# - 웹 스택 블록은 compose/web_service/nginx_uvicorn/docker-compose.yml 과 동일(상대경로만 ../../, webserver 이름 nginx-webserver).
# - openproject·jenkins 는 webserver 가 config/web-server/nginx/php/proxy/<svc>/ 를 /etc/nginx/proxy.d/<svc>/ 로 읽기 전용 마운트한다.
#   그 폴더에서 <svc>_proxy.conf.example 을 <svc>_proxy.conf 로 복사(도메인 수정)하면 nginx.conf 의 proxy.d include 로 로드된다.
# - 필수 키는 .env-example 참조(REDIS_PASSWORD·FLOWER_*·OPENPROJECT_*).
# =============================================================================

services:
  webserver:
    build: ../../docker/nginx/
    image: ${IMAGE_NAMESPACE:-devspoon}-nginx:latest
    logging: &log_opts
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-file: "${LOG_OPT_MAXF:-5}"
        max-size: "${LOG_OPT_MAXS:-100m}"
    working_dir: /application
    container_name: nginx-webserver
    volumes:
      - ../../www:/www
      - ../../script/:/script/
      - ../../config/web-server/nginx/uvicorn/conf.d/:/etc/nginx/conf.d/
      - ../../config/web-server/nginx/uvicorn/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      # proxy 샘플 폴더(:ro) — 복사본 *_proxy.conf 만 로드(없으면 주석뿐인 default.conf 만 읽혀 무해). conf.d 와 분리.
      - ../../config/web-server/nginx/php/proxy/jenkins/:/etc/nginx/proxy.d/jenkins/:ro
      - ../../config/web-server/nginx/php/proxy/openproject/:/etc/nginx/proxy.d/openproject/:ro
      - ../../config/web-server/nginx/uvicorn/proxy_params/proxy_params:/etc/nginx/proxy_params
      # dhparam 백업/복원 — 이미지에 구운 /etc/nginx/dhparam.pem 을 여기에 백업/복원한다.
      # docker compose down 후 up 시 백업본이 있으면 그대로 복원, 없으면(최초 기동) 이미지본을 백업.
      # (과거의 ./ssl/certs:/etc/ssl/certs 는 시스템 CA 번들을 가려 certbot 을 깨뜨려 제거)
      - ./ssl/dhparam/:/etc/nginx/dhparam-backup/
      - ./ssl/letsencrypt/:/etc/letsencrypt/
      - ../../log/:/log/
      - ../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    # webserver 는 uvicorn-app(8000) + redis(6379) 가 healthy 가 되어야 의미가 있다.
    # service_healthy 조건으로 race(앱 부팅 전에 nginx 가 502 를 뱉는 구간) 을 차단.
    depends_on:
      openproject:
        condition: service_started
      jenkins:
        condition: service_started
      uvicorn-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ulimits — 의도적으로 비활성화 상태. 활성화 절차는 .env 의
    # ULIMIT_NOFILE_SOFT / ULIMIT_NOFILE_HARD 와 nginx_gunicorn compose 의 동일 블록 참조.
    # ulimits:
    #   nofile:
    #     soft: ${ULIMIT_NOFILE_SOFT:-65535}
    #     hard: ${ULIMIT_NOFILE_HARD:-65535}

  uvicorn-app:
    build:
      context: ../../docker/gunicorn/
      additional_contexts:
        lock: ../../www/django_sample
    image: ${IMAGE_NAMESPACE:-devspoon}-py-app:latest
    logging: *log_opts
    working_dir: /www/${PROJECT_DIR:?PROJECT_DIR must be set in .env}
    container_name: uvicorn-app
    volumes:
      - ../../www:/www
      - ../../log:/log
      - app-data:/data
      - ../../config/app-server/uvicorn/:/uvicorn
      - ../../script/logrotate/uvicorn/uvicorn:/etc/logrotate.d/uvicorn
    # uv 네이티브 흐름 — uvicorn extra 가 gunicorn 도 포함 (gunicorn + UvicornWorker).
    # 쓰기 경로: 워커가 www-data 로 강하되므로 SQLite 는 named volume /data(SQLITE_PATH)에 두고 그 볼륨만 www-data 소유로 맞춘다.
    #          bind mount 된 호스트 소스 트리(/www)의 소유권은 바꾸지 않는다 (호스트 사용자 편집·CI 후속 단계·침해 시 소스 변조 방지).
    # Django 는 기동 전 migrate 1회(이 app 서비스만 — celery·beat 는 app healthy 뒤 기동해 동시 migrate 경쟁 없음).
    #   root 로 /data SQLite 를 만든 뒤 www-data 소유로 맞춘다.
    command: bash -c "uv sync --inexact --extra uvicorn --extra celery && { [ ! -f manage.py ] || python manage.py migrate --noinput; } && { [ ! -f prestart.sh ] || bash prestart.sh; } && chown -R www-data:www-data /data && exec gunicorn -c /uvicorn/uvicorn.conf.py"
    environment:
      TZ: "Asia/Seoul"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      SQLITE_PATH: "/data/${PROJECT_DIR:?PROJECT_DIR must be set in .env}.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
      ASGI_APP: "${ASGI_APP:-config.asgi:application}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,www.localhost,127.0.0.1}"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    # TCP 8000 이 listen 상태인지 bash 내장 /dev/tcp 로 확인 (의존성 추가 없음).
    # uvicorn.conf.py 가 0.0.0.0:8000 으로 bind — README §1 워커 가이드 참조.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # CELERY_BROKER_URL 은 REDIS_PASSWORD 로부터 합성 (SSOT) — drift 차단.
  # 자세한 설명은 nginx_gunicorn/docker-compose.yml 참조.
  celery:
    image: ${IMAGE_NAMESPACE:-devspoon}-py-app:latest
    logging: *log_opts
    working_dir: /www/${PROJECT_DIR:?PROJECT_DIR must be set in .env}
    container_name: celery-app
    volumes:
      - ../../www:/www
      - ../../log:/log
      - app-data:/data
      - ../../script/logrotate/uvicorn/celery/uvicorn-celery:/etc/logrotate.d/uvicorn-celery
    command: bash -c "mkdir -p /log/uvicorn/celery && chown -R www-data:www-data /log/uvicorn/celery /data && \
      uv sync --inexact --extra uvicorn --extra celery && \
      exec celery -A config worker \
      --uid www-data --gid www-data \
      --loglevel=INFO \
      --concurrency=8 \
      --max-tasks-per-child=2000 \
      --logfile=/log/uvicorn/celery/worker-%n%I.log"
    environment:
      TZ: "Asia/Seoul"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      SQLITE_PATH: "/data/${PROJECT_DIR:?PROJECT_DIR must be set in .env}.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,www.localhost,127.0.0.1}"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/3
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      uvicorn-app:
        condition: service_healthy
    profiles:
      - celery

  celery-beat:
    image: ${IMAGE_NAMESPACE:-devspoon}-py-app:latest
    logging: *log_opts
    working_dir: /www/${PROJECT_DIR:?PROJECT_DIR must be set in .env}
    container_name: celerybeat-app
    volumes:
      - ../../www:/www
      - ../../log:/log
      - app-data:/data
      - ../../script/logrotate/uvicorn/celerybeat/uvicorn-celerybeat:/etc/logrotate.d/uvicorn-celerybeat
    command: bash -c "mkdir -p /log/uvicorn/celerybeat && chown -R www-data:www-data /log/uvicorn/celerybeat /data && \
      uv sync --inexact --extra uvicorn --extra celery && \
      exec celery -A config beat \
      --uid www-data --gid www-data \
      --loglevel=INFO \
      --scheduler django_celery_beat.schedulers:DatabaseScheduler \
      --logfile=/log/uvicorn/celerybeat/celerybeat.log"
    environment:
      TZ: "Asia/Seoul"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      SQLITE_PATH: "/data/${PROJECT_DIR:?PROJECT_DIR must be set in .env}.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,www.localhost,127.0.0.1}"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/3
    restart: always
    depends_on:
      uvicorn-app:
        condition: service_healthy
      celery:
        condition: service_started
    profiles:
      - celery

  flower:
    image: mher/flower:2.0.1
    logging: *log_opts
    container_name: flower
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/3
      - FLOWER_BASIC_AUTH=${FLOWER_ID:?FLOWER_ID must be set}:${FLOWER_PWD:?FLOWER_PWD must be set}
    restart: always
    depends_on:
      celery-beat:
        condition: service_started
    profiles:
      - celery

  redis:
    image: redis:7.4-alpine
    logging: *log_opts
    container_name: redis_db
    # ports:
    #   - 6379:6379
    volumes:
      - ./redis/data:/data
      - ./redis/conf/:/usr/local/etc/redis/
    labels:
      - "name=redis"
      - "mode=standalone"
    environment:
      TZ: "Asia/Seoul"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: always
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  openproject:
    image: openproject/openproject:17
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: openproject
    volumes:
      - ./pgdata/:/var/openproject/pgdata/
      - ../../log/supervisor/:/var/log/supervisor/
      - ./static/:/var/openproject/assets/
    expose:
      - "80"
    environment:
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?OPENPROJECT_SECRET_KEY_BASE must be set in .env}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST_NAME:?OPENPROJECT_HOST_NAME must be set in .env}
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-false}
      EMAIL_DELIVERY_METHOD: ${EMAIL_DELIVERY_METHOD}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: "${SMTP_DOMAIN}"
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION}
      SMTP_ENABLE_STARTTLS_AUTO: "${SMTP_ENABLE_STARTTLS_AUTO}"
      SMTP_USER_NAME: "${SMTP_USER_NAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      TZ: "Asia/Seoul"
      PASSENGER_START_TIMEOUT: ${PASSENGER_START_TIMEOUT}
    restart: always

  # jenkins_home 은 저장소가 추적하는 호스트 폴더(.gitkeep)라 클론한 사용자 소유다. jenkins 이미지는 uid 1000 으로
  # 동작하므로 호스트 사용자가 1000 이 아니면 "missing rw permissions on JENKINS_HOME" 으로 재시작을 반복한다.
  # 같은 이미지를 root 로 1회 실행해 폴더(최상위만) 소유자를 1000 으로 맞춘 뒤 jenkins 를 기동한다.
  jenkins-init:
    image: jenkins/jenkins:lts-jdk21
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/var/jenkins_home"]
    volumes:
      - ./jenkins_home:/var/jenkins_home
    restart: "no"

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: jenkins
    volumes:
      - ./jenkins_home:/var/jenkins_home
    expose:
      - 8080
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      jenkins-init:
        condition: service_completed_successfully

  gitolite:
    build: ../../docker/gitolite
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    working_dir: /application
    container_name: gitolite
    volumes:
      - gitolite-repos:/home/gitolite-creator/repositories
    ports:
      - 2222:22
    environment:
      TZ: "Asia/Seoul"
    restart: always

# 앱 쓰기 데이터(SQLite) — 호스트 소스 트리(/www) 대신 named volume. `docker compose down -v` 는 이 볼륨도 지운다.
volumes:
  app-data:
  gitolite-repos:
