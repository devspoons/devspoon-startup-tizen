# =============================================================================
# master_service — uwsgi 웹 스택 + openproject + jenkins + gitolite 조합
# - 웹 스택 블록은 compose/web_service/nginx_uwsgi/docker-compose.yml 과 동일(상대경로만 ../../, webserver 이름 nginx-webserver).
# - openproject·jenkins 는 webserver 가 마운트한 conf.d 에
#   config/web-server/nginx/php/proxy/<svc>/<svc>_proxy.conf.example 을 복사(도메인 수정)해 연결한다.
# - 필수 키는 .env-example 참조(REDIS_PASSWORD·FLOWER_*·OPENPROJECT_*).
# =============================================================================

services:
  webserver:
    build: ../../docker/nginx/
    image: devspoon-nginx:latest
    logging: &log_opts
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-file: "${LOG_OPT_MAXF:-5}"
        max-size: "${LOG_OPT_MAXS:-100m}"
    working_dir: /application
    container_name: nginx-webserver
    volumes:
      - ../../www:/www
      - ../../script/:/script/
      - ../../config/web-server/nginx/uwsgi/conf.d/:/etc/nginx/conf.d/
      - ../../config/web-server/nginx/uwsgi/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      # proxy 샘플(openproject/jenkins)이 include 하는 proxy_params — uwsgi 계열에는 없어 php 계열 파일 사용
      - ../../config/web-server/nginx/php/proxy_params/proxy_params:/etc/nginx/proxy_params
      # uwsgi 스택은 uwsgi_pass 프로토콜을 쓰므로 proxy_params 가 아닌 uwsgi_params 를 마운트한다.
      # (과거 'proxy_params/proxy_params' 마운트는 소스 경로 부재로 bind mount 가 자동으로 빈
      # 디렉토리를 만들었던 버그 — sample_nginx_*.conf 들은 `include uwsgi_params;` 만 참조.)
      - ../../config/web-server/nginx/uwsgi/uwsgi_params/uwsgi_params:/etc/nginx/uwsgi_params
      # dhparam 백업/복원 — 이미지에 구운 /etc/nginx/dhparam.pem 을 여기에 백업/복원한다.
      # docker compose down 후 up 시 백업본이 있으면 그대로 복원, 없으면(최초 기동) 이미지본을 백업.
      # (과거의 ./ssl/certs:/etc/ssl/certs 는 시스템 CA 번들을 가려 certbot 을 깨뜨려 제거)
      - ./ssl/dhparam/:/etc/nginx/dhparam-backup/
      - ./ssl/letsencrypt/:/etc/letsencrypt/
      - ../../log/:/log/
      - ../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    # webserver 는 uwsgi-app(8000) + redis(6379) 가 healthy 가 되어야 의미가 있다.
    # service_healthy 조건으로 race(uwsgi 가 socket bind 전 nginx 가 502 를 뱉는 구간) 을 차단.
    depends_on:
      openproject:
        condition: service_started
      jenkins:
        condition: service_started
      uwsgi-app:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ulimits — 의도적으로 비활성화 상태. 활성화 절차는 .env 의
    # ULIMIT_NOFILE_SOFT / ULIMIT_NOFILE_HARD 와 nginx_gunicorn compose 의 동일 블록 참조.
    # ulimits:
    #   nofile:
    #     soft: ${ULIMIT_NOFILE_SOFT:-65535}
    #     hard: ${ULIMIT_NOFILE_HARD:-65535}

  uwsgi-app:
    build: ../../docker/uwsgi/
    image: devspoon-uwsgi-app:latest
    logging: *log_opts
    # working_dir 을 프로젝트 루트로 통일 — uv 가 pyproject.toml 을 자동 인식하게 함.
    # uwsgi 자체는 ini 의 chdir = /www/%(project) 로 이동 (project = $(PROJECT_DIR) env 치환).
    working_dir: /www/${PROJECT_DIR:?PROJECT_DIR must be set in .env}
    container_name: uwsgi-app
    volumes:
      - ../../www:/www
      - ../../config/app-server/uwsgi/uwsgi.ini:/application/uwsgi.ini
      - ../../log:/log
      - app-data:/data
    # uwsgi 본체 로그는 uwsgi.ini 의 log-maxsize (100MB) 로 네이티브 회전한다.
    # logrotate dropin 을 추가로 마운트하면 같은 파일에 두 회전 메커니즘이 동시에 작동해
    # race / 데이터 손실 가능성이 생기므로 의도적으로 마운트하지 않는다.
    # (celery / celery-beat 는 Python logging 이라 logrotate 필요 — 아래 서비스들 참조.)
    # 쓰기 경로: 워커가 www-data 로 강하되므로 SQLite 는 named volume /data(SQLITE_PATH)에 두고 그 볼륨만 www-data 소유로 맞춘다.
    #          bind mount 된 호스트 소스 트리(/www)의 소유권은 바꾸지 않는다 (호스트 사용자 편집·CI 후속 단계·침해 시 소스 변조 방지).
    command: bash -c "chown -R www-data:www-data /data && uv sync --inexact --extra uwsgi --extra celery && exec uwsgi --ini /application/uwsgi.ini"
    environment:
      TZ: "Asia/Seoul"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      SQLITE_PATH: "/data/${PROJECT_DIR:?PROJECT_DIR must be set in .env}.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
      PROJECT_DIR: "${PROJECT_DIR:?PROJECT_DIR must be set in .env}"
      UWSGI_MODULE: "${UWSGI_MODULE:-config.wsgi:application}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    # uwsgi.ini 의 `socket = :8000` 이 native uwsgi 프로토콜로 listen 한다 (HTTP 아님).
    # bash 내장 /dev/tcp 는 TCP 연결만 확인하므로 프로토콜과 무관하게 동작 — 의존성 추가 없음.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # CELERY_BROKER_URL 은 REDIS_PASSWORD 로부터 합성 (SSOT) — drift 차단.
  # 자세한 설명은 nginx_gunicorn/docker-compose.yml 참조.
  celery:
    image: devspoon-uwsgi-app:latest
    logging: *log_opts
    working_dir: /www/${PROJECT_DIR:?PROJECT_DIR must be set in .env}
    container_name: celery-app
    volumes:
      - ../../www:/www
      - ../../log:/log
      - app-data:/data
      - ../../script/logrotate/uwsgi/celery/uwsgi-celery:/etc/logrotate.d/uwsgi-celery
    command: bash -c "mkdir -p /log/uwsgi/celery && chown -R www-data:www-data /log/uwsgi/celery /data && \
      uv sync --inexact --extra uwsgi --extra celery && \
      exec celery -A config worker \
      --uid www-data --gid www-data \
      --loglevel=INFO \
      --concurrency=8 \
      --max-tasks-per-child=2000 \
      --logfile=/log/uwsgi/celery/worker-%n%I.log"
    environment:
      TZ: "Asia/Seoul"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      SQLITE_PATH: "/data/${PROJECT_DIR:?PROJECT_DIR must be set in .env}.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/3
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      uwsgi-app:
        condition: service_started
    profiles:
      - celery

  celery-beat:
    image: devspoon-uwsgi-app:latest
    logging: *log_opts
    working_dir: /www/${PROJECT_DIR:?PROJECT_DIR must be set in .env}
    container_name: celerybeat-app
    volumes:
      - ../../www:/www
      - ../../log:/log
      - app-data:/data
      - ../../script/logrotate/uwsgi/celerybeat/uwsgi-celerybeat:/etc/logrotate.d/uwsgi-celerybeat
    command: bash -c "mkdir -p /log/uwsgi/celerybeat && chown -R www-data:www-data /log/uwsgi/celerybeat /data && \
      uv sync --inexact --extra uwsgi --extra celery && \
      exec celery -A config beat \
      --uid www-data --gid www-data \
      --loglevel=INFO \
      --scheduler django_celery_beat.schedulers:DatabaseScheduler \
      --logfile=/log/uwsgi/celerybeat/celerybeat.log"
    environment:
      TZ: "Asia/Seoul"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}"
      SQLITE_PATH: "/data/${PROJECT_DIR:?PROJECT_DIR must be set in .env}.sqlite3"
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/3
    restart: always
    depends_on:
      celery:
        condition: service_started
    profiles:
      - celery

  flower:
    image: mher/flower:2.0.1
    logging: *log_opts
    container_name: flower
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/3
      - FLOWER_BASIC_AUTH=${FLOWER_ID:?FLOWER_ID must be set}:${FLOWER_PWD:?FLOWER_PWD must be set}
    restart: always
    depends_on:
      celery-beat:
        condition: service_started
    profiles:
      - celery

  redis:
    image: redis:7.4-alpine
    logging: *log_opts
    container_name: redis_db
    # ports:
    #   - 6379:6379
    volumes:
      - ./redis/data:/data
      - ./redis/conf/:/usr/local/etc/redis/
    labels:
      - "name=redis"
      - "mode=standalone"
    environment:
      TZ: "Asia/Seoul"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: always
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  openproject:
    image: openproject/openproject:17
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: openproject
    volumes:
      - ./pgdata/:/var/openproject/pgdata/
      - ../../log/supervisor/:/var/log/supervisor/
      - ./static/:/var/openproject/assets/
    expose:
      - "80"
    environment:
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?OPENPROJECT_SECRET_KEY_BASE must be set in .env}
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST_NAME:?OPENPROJECT_HOST_NAME must be set in .env}
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-false}
      EMAIL_DELIVERY_METHOD: ${EMAIL_DELIVERY_METHOD}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_DOMAIN: "${SMTP_DOMAIN}"
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION}
      SMTP_ENABLE_STARTTLS_AUTO: "${SMTP_ENABLE_STARTTLS_AUTO}"
      SMTP_USER_NAME: "${SMTP_USER_NAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      TZ: "Asia/Seoul"
      PASSENGER_START_TIMEOUT: ${PASSENGER_START_TIMEOUT}
    restart: always

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: jenkins
    volumes:
      - ./jenkins_home:/var/jenkins_home
    expose:
      - 8080
    environment:
      TZ: "Asia/Seoul"
    restart: always

  gitolite:
    build: ../../docker/gitolite
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    working_dir: /application
    container_name: gitolite
    volumes:
      - gitolite-repos:/home/gitolite-creator/repositories
    ports:
      - 2222:22
    environment:
      TZ: "Asia/Seoul"
    restart: always

# 앱 쓰기 데이터(SQLite) — 호스트 소스 트리(/www) 대신 named volume. `docker compose down -v` 는 이 볼륨도 지운다.
volumes:
  app-data:
  gitolite-repos:
