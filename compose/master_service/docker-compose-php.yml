# =============================================================================
# master_service — php 웹 스택 + Plane(프로젝트 관리) + Jenkins + Gitea(git 서버) 조합
# - 웹 스택 블록은 compose/web_service/nginx_php/docker-compose.yml 과 동일(상대경로만 ../../, webserver 이름 nginx-webserver).
# - plane·gitea·jenkins 는 webserver 가 config/web-server/nginx/php/proxy/<svc>/ 를 /etc/nginx/proxy.d/<svc>/ 로 읽기 전용 마운트한다.
#   그 폴더에서 <svc>_proxy.conf.example 을 <svc>_proxy.conf 로 복사(도메인 수정)하면 nginx.conf 의 proxy.d include 로 로드된다.
# - 필수 키는 .env-example 참조(REDIS_PASSWORD·FLOWER_*·PLANE_*·GITEA_*).
# =============================================================================

# Plane(프로젝트 관리) · Gitea(git 서버) 서비스는 단독 스택과 공유하는 정의를 include 한다.
# (Docker Compose >= 2.20 필요 — compose/common/ 아래 파일이 단일 출처)
include:
  - ../common/plane-services.yml
  - ../common/gitea-service.yml

services:
  webserver:
    build: ../../docker/nginx/
    image: ${IMAGE_NAMESPACE:-devspoon}-nginx:latest
    logging: &log_opts
      driver: "${LOG_DRIVER:-json-file}"
      options:
        max-file: "${LOG_OPT_MAXF:-5}"
        max-size: "${LOG_OPT_MAXS:-100m}"
    working_dir: /application
    container_name: nginx-webserver
    volumes:
      - ../../www:/www
      - ../../script/:/script/
      - ../../config/web-server/nginx/php/conf.d/:/etc/nginx/conf.d/
      - ../../config/web-server/nginx/php/proxy_params/proxy_params:/etc/nginx/proxy_params
      - ../../config/web-server/nginx/php/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      # proxy 샘플 폴더(:ro) — 복사본 *_proxy.conf 만 로드(없으면 주석뿐인 default.conf 만 읽혀 무해). conf.d 와 분리.
      - ../../config/web-server/nginx/php/proxy/jenkins/:/etc/nginx/proxy.d/jenkins/:ro
      - ../../config/web-server/nginx/php/proxy/plane/:/etc/nginx/proxy.d/plane/:ro
      - ../../config/web-server/nginx/php/proxy/gitea/:/etc/nginx/proxy.d/gitea/:ro
      - ../../config/web-server/nginx/php/fastcgi/fastcgi_params:/etc/nginx/fastcgi_params
      # dhparam 백업/복원 — 이미지에 구운 /etc/nginx/dhparam.pem 을 여기에 백업/복원한다.
      # docker compose down 후 up 시 백업본이 있으면 그대로 복원, 없으면(최초 기동) 이미지본을 백업.
      # (과거의 ./ssl/certs:/etc/ssl/certs 는 시스템 CA 번들을 가려 certbot 을 깨뜨려 제거)
      - ./ssl/dhparam/:/etc/nginx/dhparam-backup/
      - ./ssl/letsencrypt/:/etc/letsencrypt/
      - ../../log/:/log/
      - ../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    # webserver 는 php-app(FastCGI 9000) 이 healthy 가 되어야 의미가 있다.
    # redis 는 본 stack 에서 'redis' profile 로만 기동되므로 의존성에 포함하지 않는다.
    depends_on:
      plane-proxy:
        condition: service_started
      gitea:
        condition: service_started
      jenkins:
        condition: service_started
      php-app:
        condition: service_healthy
    # ulimits — 의도적으로 비활성화 상태. 활성화 절차는 .env 의
    # ULIMIT_NOFILE_SOFT / ULIMIT_NOFILE_HARD 와 nginx_gunicorn compose 의 동일 블록 참조.
    # ulimits:
    #   nofile:
    #     soft: ${ULIMIT_NOFILE_SOFT:-65535}
    #     hard: ${ULIMIT_NOFILE_HARD:-65535}

  php-app:
    build: ../../docker/php-fpm/
    image: ${IMAGE_NAMESPACE:-devspoon}-php-app:8.4
    logging: *log_opts
    working_dir: /application
    container_name: php-app
    volumes:
      - ../../www:/www
      - ../../config/app-server/php/pool.d/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ../../config/app-server/php/php_ini/php.ini:/usr/local/etc/php/php.ini:ro
      - ../../log:/log
      - ../../script/logrotate/php-fpm/php-fpm:/etc/logrotate.d/php-fpm
    environment:
      TZ: "Asia/Seoul"
    restart: always
    # php-fpm 은 pool.d/www.conf 의 `listen = 9000` 에서 FastCGI 수신.
    # bash 내장 /dev/tcp 로 socket bind 여부만 확인 — FastCGI 프로토콜 미말함.
    # 공식 php:8.4-fpm-bookworm 베이스는 bash 기본 포함.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    logging: *log_opts
    container_name: redis_db
    # ports:
    #   - 6379:6379
    volumes:
      - ./redis/data:/data
      - ./redis/conf/:/usr/local/etc/redis/
    labels:
      - "name=redis"
      - "mode=standalone"
    environment:
      TZ: "Asia/Seoul"
      # redis.conf 의 protected-mode yes 와 짝을 이루는 requirepass 패스워드.
      # healthcheck 의 redis-cli -a 가 본 변수를 사용 + command 의 --requirepass 주입에 사용.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    restart: always
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles:
      - redis

  # jenkins_home 은 저장소가 추적하는 호스트 폴더(.gitkeep)라 클론한 사용자 소유다. jenkins 이미지는 uid 1000 으로
  # 동작하므로 호스트 사용자가 1000 이 아니면 "missing rw permissions on JENKINS_HOME" 으로 재시작을 반복한다.
  # 같은 이미지를 root 로 1회 실행해 폴더(최상위만) 소유자를 1000 으로 맞춘 뒤 jenkins 를 기동한다.
  jenkins-init:
    image: jenkins/jenkins:lts-jdk21
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/var/jenkins_home"]
    volumes:
      - ./jenkins_home:/var/jenkins_home
    restart: "no"

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: jenkins
    volumes:
      - ./jenkins_home:/var/jenkins_home
    expose:
      - 8080
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      jenkins-init:
        condition: service_completed_successfully

  tizenenv:
    build: ../../docker/tizen-env/
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    working_dir: /application
    container_name: tizenenv
    # Tizen 도구 저장소(download.tizen.org …/Ubuntu_18.04)의 gbs 의존성 librpm-tizen 은 amd64 전용이고 JAVA_HOME 도 amd64 경로다.
    # arm64 등 다른 호스트에서도 amd64 이미지로 빌드·실행하도록 고정한다(비 x86_64 호스트는 qemu binfmt 에뮬레이션 필요).
    platform: linux/amd64
    # 확인필요(RR-03): Tizen mic 이미지 생성의 loop mount 용 — 빌드 검증 전까지 유지.
    # 대체 후보: cap_add: [SYS_ADMIN] + devices: [/dev/loop-control]
    privileged: true
    volumes:
      - ../../log/tizen/:/log/tizen/
      - type: bind
        source: ${TIZEN_SSH_KEY:?TIZEN_SSH_KEY must be set in .env (review.tizen.org private key path)}
        target: /root/.ssh/id_rsa
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TIZEN_AUTHORIZED_KEYS:?TIZEN_AUTHORIZED_KEYS must be set in .env (authorized_keys path)}
        target: /root/.ssh/authorized_keys
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${TIZEN_SSH_BIND:-127.0.0.1}:2221:22"
    environment:
      TZ: "Asia/Seoul"
    restart: always
