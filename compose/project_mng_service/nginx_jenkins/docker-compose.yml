services:
  nginx-proxy:
    build: ../../../docker/nginx/
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: nginx-proxy-jenkins
    volumes:
      # conf.d = 서비스 전용 proxy 폴더(:ro) + catch-all default.conf(폴더 안 추적 자리표시자 위에 파일 마운트).
      # 도메인 연결: proxy/jenkins/ 에서 cp jenkins_proxy.conf.example jenkins_proxy.conf 후 server_name 수정.
      # 복사본이 없으면 모든 Host 444 로 정상 기동.
      - ../../../config/web-server/nginx/php/proxy/jenkins/:/etc/nginx/conf.d/:ro
      - ../../../config/web-server/nginx/php/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../config/web-server/nginx/php/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      - ../../../config/web-server/nginx/php/proxy_params/proxy_params:/etc/nginx/proxy_params
      - ../../../log/:/log/
      - ../../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      - jenkins

  # jenkins_home 은 저장소가 추적하는 호스트 폴더(.gitkeep)라 클론한 사용자 소유다. jenkins 이미지는 uid 1000 으로
  # 동작하므로 호스트 사용자가 1000 이 아니면 "missing rw permissions on JENKINS_HOME" 으로 재시작을 반복한다.
  # 같은 이미지를 root 로 1회 실행해 폴더(최상위만) 소유자를 1000 으로 맞춘 뒤 jenkins 를 기동한다.
  jenkins-init:
    image: "jenkins/jenkins:lts-jdk21"
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/var/jenkins_home"]
    volumes:
      - "./jenkins_home:/var/jenkins_home"
    restart: "no"

  jenkins:
    image: "jenkins/jenkins:lts-jdk21"
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: "jenkins"
    volumes:
      - "./jenkins_home:/var/jenkins_home"
    expose:
      - 8080
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      jenkins-init:
        condition: service_completed_successfully
