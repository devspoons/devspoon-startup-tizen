services:
  nginx-proxy:
    build: ../../../docker/nginx/
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: nginx-proxy-jenkins
    volumes:
      - ../../../config/web-server/nginx/php/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 사용자 복사본: config/web-server/nginx/php/proxy/jenkins_proxy.conf.example → jenkins_proxy.conf
      - type: bind
        source: ../../../config/web-server/nginx/php/proxy/jenkins_proxy.conf
        target: /etc/nginx/conf.d/jenkins_proxy.conf
        read_only: true
        bind:
          create_host_path: false
      - ../../../config/web-server/nginx/php/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      - ../../../config/web-server/nginx/php/proxy_params/proxy_params:/etc/nginx/proxy_params
      - ../../../log/:/log/
      - ../../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      - jenkins

  jenkins:
    image: "jenkins/jenkins:latest"
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: "jenkins"
    volumes:
      - "./jenkins_home:/var/jenkins_home"
    expose:
      - 8080
    environment:
      TZ: "Asia/Seoul"
    restart: always
