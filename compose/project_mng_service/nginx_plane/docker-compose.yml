# =============================================================================
# 단독 Plane 스택 — nginx(앞단) + Plane 13서비스(compose/common/plane-services.yml)
#
# - Plane 서비스 정의는 master_service 5조합과 공유한다(include, Docker Compose >= 2.20).
# - 앞단 nginx 는 conf.d 로 proxy/plane/ 폴더를 읽기 전용 마운트한다. 도메인 연결은
#   그 폴더에서 cp plane_proxy.conf.example plane_proxy.conf 후 server_name 수정.
#   복사본이 없으면 catch-all default.conf 가 모든 Host 에 444 로 응답하며 정상 기동한다.
# - 단독 스택은 HTTP 전용이다(80). 443 은 매핑되지만 catch-all 이 TLS 핸드셰이크를 거부한다
#   — 공개망 운영은 master_service 또는 앞단 TLS 종단 뒤에 두세요(README 단독 서비스 규칙).
# =============================================================================
include:
  - ../../common/plane-services.yml

services:
  nginx-proxy:
    build: ../../../docker/nginx/
    image: ${IMAGE_NAMESPACE:-devspoon}-nginx:latest
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: nginx-proxy-plane
    volumes:
      - ../../../config/web-server/nginx/php/proxy/plane/:/etc/nginx/conf.d/:ro
      - ../../../config/web-server/nginx/php/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../config/web-server/nginx/php/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      - ../../../config/web-server/nginx/php/proxy_params/proxy_params:/etc/nginx/proxy_params
      - ../../../www:/www
      - ../../../log/:/log/
      - ../../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      plane-proxy:
        condition: service_started
