# =============================================================================
# 단독 Gitea 스택 — nginx(앞단) + Gitea(compose/common/gitea-service.yml)
#
# - Gitea 서비스 정의는 master_service 5조합과 공유한다(include, Docker Compose >= 2.20).
# - HTTP 는 앞단 nginx 가 proxy/gitea/ 의 conf 로 프록시한다(복사본이 없으면 444).
# - git over SSH 는 nginx 를 거치지 않고 gitea 컨테이너가 호스트 ${GITEA_SSH_PORT:-2222} 를 직접 게시한다.
# - 단독 스택은 HTTP 전용이다(80). 443 은 매핑되지만 catch-all 이 TLS 핸드셰이크를 거부한다.
# =============================================================================
include:
  - ../../common/gitea-service.yml

services:
  nginx-proxy:
    build: ../../../docker/nginx/
    image: ${IMAGE_NAMESPACE:-devspoon}-nginx:latest
    logging:
      driver: "${LOG_DRIVER}"
      options:
        max-file: "${LOG_OPT_MAXF}"
        max-size: "${LOG_OPT_MAXS}"
    container_name: nginx-proxy-gitea
    volumes:
      - ../../../config/web-server/nginx/php/proxy/gitea/:/etc/nginx/conf.d/:ro
      - ../../../config/web-server/nginx/php/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../config/web-server/nginx/php/nginx_conf/nginx.conf:/etc/nginx/nginx.conf
      - ../../../config/web-server/nginx/php/proxy_params/proxy_params:/etc/nginx/proxy_params
      - ../../../www:/www
      - ../../../log/:/log/
      - ../../../script/logrotate/nginx/nginx:/etc/logrotate.d/nginx
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: "Asia/Seoul"
    restart: always
    depends_on:
      gitea:
        condition: service_started
