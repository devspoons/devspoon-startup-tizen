services:
  tizenenv:
    build: ../../../docker/tizen-env/
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "100m"
    working_dir: /application
    container_name: tizenenv
    # 확인필요(RR-03): Tizen mic 이미지 생성의 loop mount 용 — 빌드 검증 전까지 유지.
    # 대체 후보: cap_add: [SYS_ADMIN] + devices: [/dev/loop-control]
    privileged: true
    volumes:
      - ../../../log/tizen/:/log/tizen/
      - type: bind
        source: ${TIZEN_SSH_KEY:?TIZEN_SSH_KEY must be set in .env (review.tizen.org private key path)}
        target: /root/.ssh/id_rsa
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TIZEN_AUTHORIZED_KEYS:?TIZEN_AUTHORIZED_KEYS must be set in .env (authorized_keys path)}
        target: /root/.ssh/authorized_keys
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${TIZEN_SSH_BIND:-127.0.0.1}:2221:22"
    environment:
      TZ: "Asia/Seoul"
    restart: always
