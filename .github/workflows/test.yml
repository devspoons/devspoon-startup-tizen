name: CI Tests

# push 시 자동으로 테스트 파이프라인이 동작한다. (배포 단계 없음 — 테스트 전용)
on:
  push:
  workflow_dispatch:

# 동일 브랜치에서 연속 push 시 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 — 이 워크플로는 저장소를 읽기만 한다
permissions:
  contents: read

jobs:
  test:
    name: 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: uv 설치
        # setup-uv 는 v8+ 부터 공급망 보안 정책상 짧은 메이저 태그(@v9)를 발행하지
        # 않는다. 반드시 정확한 버전 태그(@v9.0.0)로 핀할 것.
        uses: astral-sh/setup-uv@v9.0.0

      - name: 필수 도구 설치 (jq / curl / openssl / php-cli)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl openssl php-cli

      - name: CI 테스트 실행 (실패/성공 모두 Slack·Telegram 통보)
        run: bash script/ci/run-ci.sh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 테스트 로그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            log/ci/
            log/test_run/
          if-no-files-found: ignore
          retention-days: 14
