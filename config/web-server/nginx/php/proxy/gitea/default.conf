# 마운트 지점 자리표시자 — 편집·삭제하지 말 것 (주석뿐이라 nginx 설정으로도 무해).
# 단독 compose(gitea)가 이 폴더를 /etc/nginx/conf.d/ 로 읽기 전용 마운트하고,
# config/web-server/nginx/php/conf.d/default.conf(catch-all 444)를 이 파일 자리에 덮어 마운트한다.
# 읽기 전용 폴더 안에는 마운트 지점을 새로 만들 수 없어 파일이 미리 있어야 한다.
# master_service 는 이 폴더를 /etc/nginx/proxy.d/gitea/ 로 마운트한다 — 이 파일도 include 되지만 주석뿐이라 무해.
