# =============================================================================
# Domain Sample (HTTP→HTTPS + HTTPS) — uWSGI 백엔드
# 서버 사양: 8 vCPU / 8 GB RAM
# 백엔드  : uWSGI (Django/Flask 등)
# 사용법  : nginx_https_conf.sh 가 본 파일의 토큰을 sed 치환하여
#           conf.d/{filename}_uwsgi_https_ng.conf 로 출력한다.
# 토큰    : portnumber, domain, webroot, appname, serviceport, filename
# 인증서  : letsencrypt.sh 가 발급/갱신한다
# =============================================================================

server {
    listen          portnumber;
    server_name     domain www.domain;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root         /www/certbot;
        try_files    $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen          443 ssl;
    http2           on;
    server_name     domain www.domain;

    # ---- SSL ----------------------------------------------------------------
    ssl_certificate         /etc/letsencrypt/live/domain/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/domain/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/domain/chain.pem;
    ssl_dhparam             /etc/ssl/certs/domain/dhparam.pem;

    ssl_session_cache       shared:SSL:50m;
    ssl_session_timeout     1h;
    ssl_session_tickets     off;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers             "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_ecdh_curve          secp384r1:X25519;

    ssl_stapling            on;
    ssl_stapling_verify     on;

    # client_max_body_size 100M;

    # ---- 악성 봇 / DDoS 차단 (nginx-ultimate-bad-bot-blocker) ---------------
    # server 컨텍스트에 들어가는 ngxblocker 파일은 다음 2개뿐이다:
    #   · blockbots.conf : server-level `if ($bad_bot)` 검사 + 444 return
    #   · ddos.conf      : server-level limit_conn / limit_req directive (봇만 적용)
    # 나머지 bots.d/{whitelist,blacklist,bad-referrer,custom-bad-referrers}*.conf 는
    # globalblacklist.conf 가 http 컨텍스트 안의 map/geo 블록에서 자동으로 include
    # 한다. server 블록에 직접 include 하면 운영자가 항목을 추가하는 순간
    # `nginx -t` 가 실패하므로 절대 두지 말 것.
    # 자동 갱신: 컨테이너 안 cron 이 6시간마다 update-ngxblocker 실행
    include /etc/nginx/bots.d/blockbots.conf;
    include /etc/nginx/bots.d/ddos.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "frame-ancestors 'self';" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /log/nginx/filename.uwsgi_https_access.log main buffer=32k flush=5s;
    error_log  /log/nginx/filename.uwsgi_https_error.log  warn;

    location /media/ {
        alias       /www/webroot/media/;
        autoindex   off;
        access_log  off;
        expires     30d;
        add_header  Cache-Control "public, max-age=2592000";

        location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires     max;
            add_header  Cache-Control "public, max-age=31536000, immutable";
            access_log  off;
        }
    }

    location /static/ {
        alias       /www/webroot/static/;
        autoindex   off;
        access_log  off;
        expires     max;
        add_header  Cache-Control "public, max-age=31536000, immutable";

        location ~* \.(woff|woff2|ttf|eot)$ {
            add_header  Access-Control-Allow-Origin "*";
            add_header  Cache-Control "public, max-age=31536000, immutable";
            expires     max;
            access_log  off;
        }
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root         /www/certbot;
        try_files    $uri =404;
    }

    location / {
        autoindex off;

        # 프로젝트 정책: 글로벌 rate-limit 비활성 (ngxblocker 가 봇 전용 쓰로틀링 담당).
        # 도메인 단위 throttle 이 필요하면 해당 도메인 conf.d 파일 안에 고유 이름의
        # limit_conn_zone / limit_req_zone 을 정의한 뒤 location 에서만 호출하라.

        limit_except GET POST HEAD OPTIONS PUT DELETE PATCH {
            deny all;
        }

        include /etc/nginx/uwsgi_params;

        uwsgi_pass appname:serviceport;

        uwsgi_connect_timeout       60s;
        uwsgi_send_timeout          60s;
        uwsgi_read_timeout          60s;

        uwsgi_buffering             on;
        uwsgi_buffer_size           16k;
        uwsgi_buffers               16 16k;
        uwsgi_busy_buffers_size     32k;
        uwsgi_temp_file_write_size  32k;
        uwsgi_max_temp_file_size    1024m;

        uwsgi_ignore_client_abort   on;

        # HTTPS 정보를 백엔드에 명시적으로 전달
        uwsgi_param HTTPS               on;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(log|binary|pem|enc|crt|conf|cnf|sql|sh|key|yml|yaml|toml|ini|env|lock|bak|backup|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (composer\.(json|lock|phar)|package(-lock)?\.json|yarn\.lock|requirements\.txt|Pipfile(\.lock)?|pyproject\.toml|poetry\.lock|gulpfile\.js|gruntfile\.js|phpunit\.xml|artisan)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log    off;
        allow all;
    }
}
