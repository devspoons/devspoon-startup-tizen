# =============================================================================
# Domain Sample (HTTP→HTTPS + HTTPS, proxy-only) — gunicorn/HTTP 백엔드
# 서버 사양: 8 vCPU / 8 GB RAM
# 용도   : 정적 파일을 백엔드가 직접 처리하는 순수 리버스 프록시
# 사용법 : nginx_proxy_https_conf.sh 가 본 파일의 토큰을 sed 치환하여
#          conf.d/{filename}_proxy_https_ng.conf 로 출력한다.
# 토큰   : portnumber, domain, proxyurl, proxyport, crontab_folder, filename
# 인증서 : letsencrypt.sh 가 발급/갱신
# =============================================================================

server {
    listen          portnumber;
    server_name     domain www.domain;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root         crontab_folder;
        try_files    $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen          443 ssl;
    http2           on;
    server_name     domain www.domain;

    ssl_certificate         /etc/letsencrypt/live/domain/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/domain/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/domain/chain.pem;
    ssl_dhparam             /etc/ssl/certs/domain/dhparam.pem;

    ssl_session_cache       shared:SSL:50m;
    ssl_session_timeout     1h;
    ssl_session_tickets     off;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers             "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_ecdh_curve          secp384r1:X25519;

    ssl_stapling            on;
    ssl_stapling_verify     on;

    # ---- 악성 봇 / DDoS 차단 (nginx-ultimate-bad-bot-blocker) ---------------
    # server 컨텍스트에 들어가는 ngxblocker 파일은 다음 2개뿐이다:
    #   · blockbots.conf : server-level `if ($bad_bot)` 검사 + 444 return
    #   · ddos.conf      : server-level limit_conn / limit_req directive (봇만 적용)
    # 나머지 bots.d/{whitelist,blacklist,bad-referrer,custom-bad-referrers}*.conf 는
    # globalblacklist.conf 가 http 컨텍스트 안의 map/geo 블록에서 자동으로 include
    # 한다. server 블록에 직접 include 하면 운영자가 항목을 추가하는 순간
    # `nginx -t` 가 실패하므로 절대 두지 말 것.
    # 자동 갱신: 컨테이너 안 cron 이 6시간마다 update-ngxblocker 실행
    include /etc/nginx/bots.d/blockbots.conf;
    include /etc/nginx/bots.d/ddos.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "frame-ancestors 'self';" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /log/nginx/filename.proxy_https_access.log main buffer=32k flush=5s;
    error_log  /log/nginx/filename.proxy_https_error.log  warn;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root         crontab_folder;
        try_files    $uri =404;
    }

    location / {
        autoindex off;

        # 프로젝트 정책: 글로벌 rate-limit 비활성 (ngxblocker 가 봇 전용 쓰로틀링 담당).
        # 도메인 단위 throttle 이 필요하면 해당 도메인 conf.d 파일 안에 고유 이름의
        # limit_conn_zone / limit_req_zone 을 정의한 뒤 location 에서만 호출하라.

        limit_except GET POST HEAD OPTIONS PUT DELETE PATCH {
            deny all;
        }

        include /etc/nginx/proxy_params;

        proxy_pass http://proxyurl:proxyport;

        # WebSocket 사용 시 활성화
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(log|binary|pem|enc|crt|conf|cnf|sql|sh|key|yml|yaml|toml|ini|env|lock|bak|backup|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log    off;
        allow all;
    }
}
