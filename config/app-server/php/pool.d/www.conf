; 기본 php-fpm pool — compose 가 이 파일 하나만 /usr/local/etc/php-fpm.d/www.conf 로 마운트한다
; (이미지의 docker.conf·zz-docker.conf(daemonize = no) 유지). 풀 조정은 이 파일을 편집한다.
; php_conf.sh 가 만드는 pool.d/<domain>_php.conf 는 이 스택에서 로드되지 않는다 — 추가 pool 이 필요하면 compose 에 그 파일을
; 별도 마운트하고, 이 파일과 같은 포트(9000)면 php-fpm 이 주소 충돌로 기동하지 않으므로 포트를 달리해 nginx fastcgi_pass 를 맞춘다.
[www]
user = www-data
group = www-data
; nginx 의 fastcgi_pass php-app:9000 과 일치
listen = 9000
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
request_terminate_timeout = 60s
; 심층 방어 — .php 외 확장자는 FPM 이 실행하지 않는다
security.limit_extensions = .php

; ─────────────────────────────────────────────────────────────────────────────
; 로그는 README 의 일원화 구조(호스트 ./log/ → 컨테이너 /log/)를 따른다.
; script/logrotate/php-fpm/php-fpm 이 아래 3개 파일을 회전 대상으로 잡고 있는데,
; 이미지의 docker.conf 는 access.log 와 error_log 를 /proc/self/fd/2(컨테이너 stdout)로
; 보낸다. 이 파일은 docker.conf 다음(알파벳 순)에 로드되므로 아래 지시어가 이긴다 —
; 선언하지 않으면 log/php-fpm/ 이 계속 비어 있어 드롭인이 회전할 대상을 찾지 못한다.
; clear_env·catch_workers_output 은 docker.conf 가 그대로 살아 있으므로 다시 적지 않는다
; (디렉터리째 마운트하는 devspoon-web 은 그 값들까지 직접 들고 간다).
access.log = /log/php-fpm/access.log
slowlog = /log/php-fpm/slow.log
request_slowlog_timeout = 10s
php_admin_value[error_log] = /log/php-fpm/www-error.log
php_admin_flag[log_errors] = on
